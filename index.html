<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt-Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Projekt<span>.</span>Tracker</h1>
    <span class="header-meta" id="date-display"></span>
</header>

<main>
    <!-- STATS -->
    <div class="stats-bar">
        <div class="stat-card total">
            <div class="stat-label">Gesamt</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card active">
            <div class="stat-label">Aktiv</div>
            <div class="stat-value" id="stat-active">0</div>
        </div>
        <div class="stat-card done">
            <div class="stat-label">Abgeschlossen</div>
            <div class="stat-value" id="stat-done">0</div>
        </div>
        <div class="stat-card overdue">
            <div class="stat-label">Überfällig</div>
            <div class="stat-value" id="stat-overdue">0</div>
        </div>
    </div>

    <!-- SECTION HEADER -->
    <div class="section-header">
        <h2 class="section-title">Meine Projekte</h2>
        <div class="filter-tabs">
            <button class="filter-tab active" data-cat="Alle">Alle</button>
            <button class="filter-tab" data-cat="Renovierung">🔨 Renovierung</button>
            <button class="filter-tab" data-cat="Nebenprojekte">💡 Nebenprojekte</button>
            <button class="filter-tab" data-cat="Weiterbildung">📚 Weiterbildung</button>
            <button class="filter-tab" data-cat="Fitnessziele">🏃 Fitnessziele</button>
        </div>
    </div>

    <!-- PROJECT GRID -->
    <div class="project-grid" id="project-grid"></div>

    <div class="empty-state" id="empty-state">
        <i class="fa-regular fa-folder-open"></i>
        <p>Keine Projekte gefunden.<br>Erstelle dein erstes Projekt!</p>
    </div>

    <!-- ADD BUTTON -->
    <button class="add-project-btn" onclick="openModal()">
        <i class="fa-solid fa-plus"></i>
        Neues Projekt hinzufügen
    </button>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        <h2 class="modal-title">Neues Projekt</h2>

        <div class="form-group">
            <label class="form-label">Projektname *</label>
            <input type="text" class="form-input" id="f-name" placeholder="z.B. Badezimmer renovieren">
        </div>

        <div class="form-group">
            <label class="form-label">Beschreibung</label>
            <textarea class="form-textarea" id="f-desc" placeholder="Was soll erreicht werden?"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Kategorie *</label>
            <div class="cat-selector">
                <div class="cat-option" data-cat="Renovierung" onclick="selectCat(this)">🔨 Renovierung</div>
                <div class="cat-option" data-cat="Nebenprojekte" onclick="selectCat(this)">💡 Nebenprojekte</div>
                <div class="cat-option" data-cat="Weiterbildung" onclick="selectCat(this)">📚 Weiterbildung</div>
                <div class="cat-option" data-cat="Fitnessziele" onclick="selectCat(this)">🏃 Fitnessziele</div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Startdatum</label>
                <input type="date" class="form-input" id="f-start">
            </div>
            <div class="form-group">
                <label class="form-label">Deadline</label>
                <input type="date" class="form-input" id="f-deadline">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Priorität</label>
            <div class="prio-selector">
                <div class="prio-option" data-prio="Niedrig" onclick="selectPrio(this)">🟢 Niedrig</div>
                <div class="prio-option selected" data-prio="Mittel" onclick="selectPrio(this)">🟡 Mittel</div>
                <div class="prio-option" data-prio="Hoch" onclick="selectPrio(this)">🔴 Hoch</div>
            </div>
        </div>

        <button class="btn-primary" onclick="saveProject()">Projekt erstellen</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
